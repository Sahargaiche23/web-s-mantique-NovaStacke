<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inscription - EcoTravel</title>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
</head>
<body class="bg-gradient-to-br from-blue-400 via-blue-500 to-blue-600 min-h-screen flex items-center justify-center">
    <div class="container mx-auto px-4 py-8">
        <div class="max-w-md mx-auto bg-white rounded-2xl shadow-2xl overflow-hidden">
            <!-- Header -->
            <div class="bg-blue-600 text-white p-8 text-center">
                <h1 class="text-3xl font-bold mb-2">🌍 EcoTravel</h1>
                <p class="text-blue-100">Créez votre compte voyageur</p>
            </div>

            <!-- Registration Form -->
            <div class="p-8">
                <form id="register-form" onsubmit="handleRegister(event)">
                    <!-- Alert Messages -->
                    <div id="alert-container"></div>

                    <!-- Username -->
                    <div class="mb-4">
                        <label for="username" class="block text-gray-700 font-semibold mb-2">
                            👤 Nom d'utilisateur
                        </label>
                        <input 
                            type="text" 
                            id="username" 
                            name="username" 
                            required
                            minlength="3"
                            class="w-full px-4 py-3 border-2 border-gray-300 rounded-lg focus:outline-none focus:border-blue-500 transition duration-200"
                            placeholder="Choisissez un nom d'utilisateur"
                        >
                        <p class="text-xs text-gray-500 mt-1">Minimum 3 caractères</p>
                    </div>

                    <!-- Email -->
                    <div class="mb-4">
                        <label for="email" class="block text-gray-700 font-semibold mb-2">
                            📧 Email
                        </label>
                        <input 
                            type="email" 
                            id="email" 
                            name="email" 
                            required
                            class="w-full px-4 py-3 border-2 border-gray-300 rounded-lg focus:outline-none focus:border-blue-500 transition duration-200"
                            placeholder="votre@email.com"
                        >
                    </div>

                    <!-- Password -->
                    <div class="mb-4">
                        <label for="password" class="block text-gray-700 font-semibold mb-2">
                            🔒 Mot de passe
                        </label>
                        <input 
                            type="password" 
                            id="password" 
                            name="password" 
                            required
                            minlength="6"
                            class="w-full px-4 py-3 border-2 border-gray-300 rounded-lg focus:outline-none focus:border-blue-500 transition duration-200"
                            placeholder="Choisissez un mot de passe"
                        >
                        <p class="text-xs text-gray-500 mt-1">Minimum 6 caractères</p>
                    </div>

                    <!-- Confirm Password -->
                    <div class="mb-6">
                        <label for="confirm-password" class="block text-gray-700 font-semibold mb-2">
                            🔒 Confirmer le mot de passe
                        </label>
                        <input 
                            type="password" 
                            id="confirm-password" 
                            name="confirm-password" 
                            required
                            minlength="6"
                            class="w-full px-4 py-3 border-2 border-gray-300 rounded-lg focus:outline-none focus:border-blue-500 transition duration-200"
                            placeholder="Confirmez votre mot de passe"
                        >
                    </div>

                    <!-- Submit Button -->
                    <button 
                        type="submit" 
                        id="register-btn"
                        class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 px-4 rounded-lg transition duration-200 shadow-lg hover:shadow-xl"
                    >
                        Créer mon compte
                    </button>
                </form>

                <!-- Divider -->
                <div class="my-6 border-t border-gray-300"></div>

                <!-- Login Link -->
                <div class="text-center">
                    <p class="text-gray-600">
                        Vous avez déjà un compte ?
                        <a href="login.html" class="text-blue-600 hover:text-blue-700 font-semibold">
                            Se connecter
                        </a>
                    </p>
                </div>
            </div>
        </div>
    </div>

    <script>
        const API_URL = 'http://localhost:5000';

        function showAlert(message, type = 'error') {
            const alertContainer = document.getElementById('alert-container');
            const alertClass = type === 'error' ? 'bg-red-50 border-red-500 text-red-700' : 'bg-green-50 border-green-500 text-green-700';
            
            alertContainer.innerHTML = `
                <div class="${alertClass} border-l-4 p-4 mb-4 rounded">
                    <p class="font-semibold">${message}</p>
                </div>
            `;
            
            setTimeout(() => {
                alertContainer.innerHTML = '';
            }, 5000);
        }

        async function handleRegister(event) {
            event.preventDefault();
            
            const username = document.getElementById('username').value;
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const confirmPassword = document.getElementById('confirm-password').value;
            const registerBtn = document.getElementById('register-btn');
            
            // Validate passwords match
            if (password !== confirmPassword) {
                showAlert('Les mots de passe ne correspondent pas');
                return;
            }
            
            // Disable button
            registerBtn.disabled = true;
            registerBtn.textContent = 'Création du compte...';
            
            try {
                const response = await fetch(`${API_URL}/api/auth/register`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ 
                        username, 
                        email, 
                        password,
                        role: 'voyageur'
                    })
                });
                
                const data = await response.json();
                
                if (data.success) {
                    showAlert('Compte créé avec succès ! Redirection vers la page de connexion...', 'success');
                    
                    setTimeout(() => {
                        window.location.href = 'login.html';
                    }, 2000);
                } else {
                    showAlert(data.error || 'Erreur lors de la création du compte');
                    registerBtn.disabled = false;
                    registerBtn.textContent = 'Créer mon compte';
                }
            } catch (error) {
                console.error('Registration error:', error);
                showAlert('Erreur de connexion au serveur');
                registerBtn.disabled = false;
                registerBtn.textContent = 'Créer mon compte';
            }
        }

        // Check if already logged in
        window.onload = function() {
            const token = localStorage.getItem('access_token');
            if (token) {
                window.location.href = 'index.html';
            }
        };
    </script>
</body>
</html>
